name: Main

on:
  push:
    branches: [main]

# A newer push cancels an older run, so main on Docker Hub never moves back to
# an older commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
