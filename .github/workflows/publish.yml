name: Publish

# Pushes the image for the commit that called it. A release tag publishes
# vX.Y.Z, sha-<short> and latest; a push to main publishes sha-<short> and
# main, for environments that track main. latest and main never move
# together.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish-image:
    name: Publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # For the arm64 runtime layer only.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Pushes from main need a refs/heads/main ruleset on this connection,
      # beside the release-tag one.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: 22f85f2d-a4a5-4706-adea-7cd8333183f7
        with:
          username: metacensus

      # A re-run of an older main run must not move main back to its commit.
      - name: Check this commit is main's head
        id: head
        if: github.ref == 'refs/heads/main'
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "current=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/metacensus/service-api-standard
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=branch,enable=${{ steps.head.outputs.current == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
