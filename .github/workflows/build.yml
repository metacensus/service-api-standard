name: Build

# The checks, as a reusable workflow: every orchestrator (pull request, push to
# main, release, weekly schedule) calls this, so each trigger runs one suite.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            integration/go.sum
      - run: make lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-race

  adapter:
    name: Postgres adapter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-adapter

  artifact:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: integration/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: metacensus/service-api-standard:ci
          platforms: linux/amd64
      - run: make test-artifact SERVICE_IMAGE=metacensus/service-api-standard:ci
