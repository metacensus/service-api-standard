name: Release

on:
  push:
    tags:
      # Not `v*`: globs would match a stray tag named `v`.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  # The suite every pull request ran, re-run at the tagged commit; gates the
  # publish below.
  verify:
    name: Verify
    uses: ./.github/workflows/build.yml

  publish-image:
    name: Publish the image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # One clear line instead of a login failure, and no value ever printed.
      - name: Require the Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error title=Missing secret::DOCKERHUB_TOKEN is not set on this repository. Set it with: gh secret set DOCKERHUB_TOKEN --repo metacensus/service-api-standard"
            exit 1
          fi

      # For the arm64 runtime layer only.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          # An organization access token authenticates as the organization: the
          # username is the org name, the token goes in the password field.
          username: metacensus
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/metacensus/service-api-standard
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
