name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
