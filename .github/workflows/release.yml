name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/build.yml

  publish-image:
    name: Publish the image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: metacensus/service-api-standard
    steps:
      - uses: actions/checkout@v4

      # For the arm64 runtime layer only.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: 22f85f2d-a4a5-4706-adea-7cd8333183f7
        with:
          username: metacensus

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Require the push role
        env:
          MAIN_IMAGE_ROLE_ARN: ${{ vars.MAIN_IMAGE_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          for v in MAIN_IMAGE_ROLE_ARN AWS_REGION; do
            if [ -z "${!v}" ]; then
              echo "::error title=Missing variable::$v is not set: gh variable set $v --repo ${{ github.repository }} --body <value>"
              exit 1
            fi
          done

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.MAIN_IMAGE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # A copy of the image just pushed, by digest, so both registries hold one
      # digest. ECR gets the release tag alone: its sha- tags are main's, and
      # every ECR tag but main is immutable, latest included.
      - name: Copy the release to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$REGISTRY/$IMAGE:$GITHUB_REF_NAME" "docker.io/$IMAGE@$DIGEST"
